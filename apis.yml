aid: phia
name: Phia
description: 'Phia is a personal shopping assistant that helps consumers build their
  closet and find the best prices instantly across the web. Co-founded by Phoebe Gates
  and Sophia Kianni, the product spans a mobile app and a browser extension that compares
  prices for a given item across new and resale marketplaces, tracking more than 700
  fashion, beauty, and lifestyle brands. The public phia.com site is a consumer storefront
  (a brand directory plus editorial style edits) and exposes no developer API, documentation,
  or programmatic surface. This profile was surfaced as a portfolio company of GGV
  Capital and enriched from live probes of the public site.'
